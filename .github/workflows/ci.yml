name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,tracing]"
      - name: Lint
        run: ruff check lumen_rag tests
      - name: Test (offline mode — no API key)
        run: pytest -q
      - name: Eval regression guard
        run: |
          lumen ingest data/docs
          python scripts/check_eval.py data/eval.jsonl --k 3 --mode hybrid
      - name: Validate eval set v2
        run: python scripts/validate_eval_set.py

  pgvector:
    name: pgvector store tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,pgvector]"
      - name: pgvector tests (fail if any are skipped)
        shell: bash
        env:
          LUMEN_TEST_PG_DSN: postgresql://lumen:lumen@localhost:5432/lumen
        run: |
          pytest -m pgvector -q -rs | tee "$RUNNER_TEMP/pgvector.txt"
          if grep -q SKIPPED "$RUNNER_TEMP/pgvector.txt"; then
            echo "pgvector tests were skipped, so nothing was verified"
            exit 1
          fi
