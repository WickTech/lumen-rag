[project]
name = "lumen-rag"
version = "0.1.0"
description = "A transparent, evaluated RAG engine: ingest documents, retrieve with vector search, answer with citations, and measure retrieval quality."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishabh Verma" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.13",
]

[project.optional-dependencies]
openai = ["openai>=1.55"]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
loaders = ["pypdf>=4.0", "python-docx>=1.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
lumen = "lumen_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumen_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
